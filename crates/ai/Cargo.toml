[package]
name = "figcraft-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "FigCraft's AI image providers: Sign in with ChatGPT (OAuth with PKCE on a loopback port, using the user's own ChatGPT plan) and the Responses API calls made with it"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
