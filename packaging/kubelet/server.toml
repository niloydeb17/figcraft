listen = "0.0.0.0:47900"
data = "/data"
public_url = "wss://figcraft.kubelet.cloud/"

# Figma-style cloud files: Share > Start sharing works without the server key, files are kept until
# removed, and every shared file is listed under Home > Online in the desktop app and the browser.
open_publish = true
idle_days = 0
team_files = "edit"
web_url = "https://figcraft.kubelet.cloud/"
max_file_mb = 64

# Everyone reaches the server through the same proxy address, so the per-address limits are
# raised to team-wide ones.
max_files_per_ip = 1000
max_mb_per_ip = 10240
max_connections_per_ip = 512
connects_per_minute = 600
publishes_per_hour = 200
messages_per_second = 2000
