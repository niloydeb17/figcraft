listen = "0.0.0.0:47900"
data = "/data"
public_url = "wss://figcraft.kubelet.cloud/"

# Figma-style cloud files: Share > Start sharing works without the server key and files are kept
# until removed. No team list (`team_files`): this host is public and the server has no accounts
# yet, so a list would let anyone who reaches it open and edit every shared file. Turn it back on
# once sign-in lands (docs/accounts-design.md).
open_publish = true
idle_days = 0
web_url = "https://figcraft.kubelet.cloud/"
max_file_mb = 64

# Accounts: the sign-in page at https://figcraft.kubelet.cloud/login (nginx in the web container
# sends /login, /logout and /auth/ here). Anyone may sign up; `signup = false` closes it. Google
# sign-in turns on with `google_client_id` here plus FIGCRAFT_GOOGLE_CLIENT_SECRET in Dokploy's
# environment for this compose.
accounts_listen = "0.0.0.0:47901"

# Everyone reaches the server through the same proxy address, so the per-address limits are
# raised to team-wide ones.
max_files_per_ip = 1000
max_mb_per_ip = 10240
max_connections_per_ip = 512
connects_per_minute = 600
publishes_per_hour = 200
messages_per_second = 2000
