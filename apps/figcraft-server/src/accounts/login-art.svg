    <path d="M40-40H300C290 40 230 90 160 80 100 72 60 20 40-40Z" fill="#4b2a18" opacity=".92"/>
    <path d="M560 800C640 700 760 620 860 590 900 580 910 610 880 640 800 720 690 790 600 840 560 860 540 830 560 800Z" fill="#4b2a18"/>
    <path d="M120 200C170 150 250 170 270 230 286 280 250 320 200 316 140 312 90 250 120 200Z" fill="#b59ad8"/>
  </g>
  <rect width="1000" height="1100" filter="url(#grain)" opacity=".28"/>
</svg>
