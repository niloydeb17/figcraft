<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100" preserveAspectRatio="xMidYMid slice">
  <!-- Original abstract artwork for FigCraft's sign-in page (MIT OR Apache-2.0). -->
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="46" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
